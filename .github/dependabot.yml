# Weekly update PRs for every ecosystem this repository might use. An entry
# whose manifest does not exist is skipped by Dependabot.
version: 2
updates:
  # covers npm, pnpm, yarn and bun lockfiles
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # wait a week before proposing a new release, so broken or malicious
    # publishes are usually caught and pulled first
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # one PR for routine minor/patch bumps; majors still arrive one by one
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
